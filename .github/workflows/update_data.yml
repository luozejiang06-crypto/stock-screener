name: 自动更新美股标普500数据

on:
  schedule:
    # 每周二至周六 凌晨 07:30 (北京时间) / 08:30 (东京时间) 执行
    # 对应美股周一至周五全部盘后清算结束后的稳定时间窗口
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页上手动随时一键运行

permissions:
  contents: write # 显式赋予 GitHub Actions 写入与推送权限

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装抓取依赖
        run: |
          pip install pandas yfinance requests lxml html5lib

      - name: 运行全量数据同步
        run: |
          python sync_sp500.py

      - name: 自动将最新数据提交并推送到仓库
        run: |
          git config --global user.name "Stock-Data-Bot"
          git config --global user.email "bot@github.com"
          git add sp500_data.csv
          # 若数据有变动则提交并推送，附带触发 Streamlit 云端自动重新拉取
          git diff --staged --quiet || (git commit -m "🤖 自动同步最新美股行情数据 [skip ci]" && git push)
